name: Security Audit

# 依存クレート（Cargo.lock）のRustSecアドバイザリDBに対する既知脆弱性チェック。
# rust-ci.yml/docs-check.ymlと同じ考え方で、依存関係に変更があったPRでのみ実行する。
on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
