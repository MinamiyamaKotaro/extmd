name: Coverage

# rust-ci.ymlと同じ対象パスの変更時にのみ実行する。masterへのpushでも実行するのは、
# READMEのcodecovバッジ（デフォルトブランチの最新カバレッジ）を意味のある値にするため。
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/coverage.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # 公開リポジトリのためtokenlessアップロードでも動作するが、レート制限緩和のため
      # CODECOV_TOKENが登録済みなら利用する（未登録の場合は空文字列が渡り、Codecov側で
      # tokenlessアップロードとして扱われる）。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
