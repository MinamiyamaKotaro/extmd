[package]
name = "extmd"
version = "0.1.0"
edition = "2021"
description = "Excel (.xlsx) to Markdown converter with overflow-cell merging support."
license = "MIT"

# `src/main.rs`（CLIバイナリ）はcli/reader/analysis/rendererの実装後、別PRで追加する
# （docs/design/cli.md 1章「責務分担」参照）。このPRはdomain層のみを追加するため、
# ライブラリターゲットのみを持つ。

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
