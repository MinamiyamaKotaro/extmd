[package]
name = "extmd"
version = "0.1.0"
edition = "2021"
description = "Excel (.xlsx) to Markdown converter with overflow-cell merging support."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
umya-spreadsheet = "3.0"
log = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
